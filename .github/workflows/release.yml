name: GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tests ausführen
        run: swift test

      - name: App-Paket erstellen
        run: bash Scripts/build-app.sh

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/seifert-it-Security-Reader-macOS-v${VERSION}.zip"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --verify-tag \
            --generate-notes \
            --title "seifert-it Security Reader ${VERSION}"
